databases:
  - name: flashcards-api-db
    plan: free
    databaseName: flashcards_api
    user: flashcards_api

services:
  - type: web
    name: flashcards-api
    runtime: docker
    plan: free
    dockerCommand: ./bin/rails server
    healthCheckPath: /up
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: flashcards-api-db
          property: connectionString
      - key: CACHE_DATABASE_URL
        fromDatabase:
          name: flashcards-api-db
          property: connectionString
      - key: QUEUE_DATABASE_URL
        fromDatabase:
          name: flashcards-api-db
          property: connectionString
      - key: CABLE_DATABASE_URL
        fromDatabase:
          name: flashcards-api-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
